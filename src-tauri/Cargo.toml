[package]
name = "stillharbour"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.3"
stillharbour-core = { path = "../crates/core" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid = { version = "=1.29.0", features = ["v4"] }
zeroize.workspace = true
tempfile = { workspace = true, optional = true }
blake3 = { version = "=1.8.7", optional = true }
tauri-plugin-wdio = { version = "=1.5.1", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }

[features]
default = []
copy-workflow = ["stillharbour-core/copy-workflow"]
backup-workflow = ["stillharbour-core/backup-workflow"]
desktop-test = ["copy-workflow", "backup-workflow", "dep:tempfile", "dep:blake3", "stillharbour-core/fixture-probes", "dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.191"

[lints]
workspace = true
