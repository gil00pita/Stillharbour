[package]
name = "stillharbour"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.3"
stillharbour-core = { path = "../crates/core" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid = { version = "=1.29.0", features = ["v4"] }
tempfile = { workspace = true, optional = true }
tauri-plugin-wdio = { version = "=1.5.1", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }

[features]
default = []
desktop-test = ["dep:tempfile", "stillharbour-core/fixture-probes", "dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[lints]
workspace = true
