name: Foundation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare reviewed host backup resources
        run: node scripts/backup-helpers.mjs --download
      - run: npm run check
      - name: Actual generated snapshot application recovery tests
        run: cargo test --locked -p stillharbour-core --lib --features fixture-probes,copy-workflow,backup-workflow library::snapshots::application_tests -- --ignored
      - name: Native catalog preservation, activation authority and recovery
        run: cargo test --locked -p stillharbour-core --lib --features fixture-probes,copy-workflow,backup-workflow catalog_restore -- --include-ignored
      - name: Actual snapshot process-exit and restart recovery
        run: cargo test --locked -p stillharbour-core --lib --features fixture-probes,copy-workflow,backup-workflow library::snapshots::process_failures -- --ignored
      - name: Native schedule, multi-root loss and coordination acceptance
        run: cargo test --locked -p stillharbour-core --lib --features fixture-probes,copy-workflow,backup-workflow library::snapshots::native_acceptance -- --ignored
      - name: Damaged and unknown media preserve both snapshot versions
        run: cargo test --locked -p stillharbour-core --lib --features fixture-probes,copy-workflow,backup-workflow library::snapshots::content_preservation -- --ignored
      - name: Native transfer pause, rate changes and cancellation
        run: cargo test --locked -p stillharbour-core --lib --features fixture-probes,copy-workflow,backup-workflow sync_application_native_controls -- --ignored
      - run: npm run release:check
      - run: npm run desktop:test:build
      - run: npm run desktop:test
      - name: Native catalog activation and retained edits across three launches
        run: npm run desktop:test:catalog
      - name: Native cross-volume generated fixtures
        run: npm run native:cross-volume
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-evidence-${{ matrix.os }}
          path: |
            .context/screenshots
            .context/m4b-append/**/m4b-append.json
            .context/m4c-retained/**/m4c-retained.json
            .context/m4-application
            .context/m4-catalog-restart
            .context/wdio-catalog-restart
            .context/wdio
            .context/gallery/**/warm-scroll.json
            .context/gallery/**/preparation-pause.json
            .context/gallery/**/job-pause.json
            .context/gallery/**/manifest-*.json
            .context/gallery/**/multi-source-*.json
            .context/gallery/**/m3-inspections-*.json
            .context/gallery/**/m4a-comparison.json
            .context/windows-directory-selection/native-*/*.json
            .context/generated-rename/*.json
            .context/cross-volume/**/*.json
            .context/cross-volume/**/*.log
            .context/cross-volume/**/*.txt
            .context/cross-volume/**/*.stdout
            .context/cross-volume/**/*.stderr
