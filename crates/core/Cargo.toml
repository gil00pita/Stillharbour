[package]
name = "stillharbour-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
fixture-probes = []
copy-workflow = []
backup-workflow = []

[[example]]
name = "foundation_probe"
required-features = ["fixture-probes"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
quick-xml = "=0.42.0"
kamadak-exif = "=0.6.1"
thiserror.workspace = true
tokio.workspace = true
rusqlite = { version = "=0.41.0", features = ["bundled", "backup"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
globset = "=0.4.20"
blake3 = "=1.8.7"
crc32fast = "=1.5.3"
sha2 = "=0.11.1"
sha1 = "=0.11.0"
md-5 = "=0.11.0"
unicode-normalization = "=0.1.26"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings"] }
uuid = { version = "=1.29.0", features = ["v4"] }
fs2 = "=0.4.3"
notify = "=8.2.1"
tempfile.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
rustix = { version = "=1.1.6", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemServices", "Win32_System_IO", "Win32_System_Ioctl", "Wdk_Storage_FileSystem", "Wdk_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
security-framework-sys = "=2.17.0"

[lints]
workspace = true

[[example]]
name = "library_probe"
required-features = ["fixture-probes"]

[[example]]
name = "packaged_library_probe"
required-features = ["fixture-probes"]

[[example]]
name = "performance_probe"
required-features = ["fixture-probes"]

[build-dependencies]
cc = "=1.10.0"

[[example]]
name = "format_probe"
required-features = ["fixture-probes"]

[[example]]
name = "scheduler_probe"
required-features = ["fixture-probes"]

[[example]]
name = "filtered_probe"
required-features = ["fixture-probes"]

[[example]]
name = "cross_volume_probe"
required-features = ["fixture-probes", "copy-workflow"]

[[example]]
name = "backup_application_probe"
required-features = ["fixture-probes", "backup-workflow"]
